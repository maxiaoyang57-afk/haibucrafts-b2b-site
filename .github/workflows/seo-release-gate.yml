name: SEO Release Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-release-gate:
    name: Test, build and audit production SEO
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run test suite
        run: npm test

      - name: Install mobile browser test runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.58.2
          npx playwright install --with-deps chromium

      - name: Verify mobile product galleries, search and quote prefills
        run: npx playwright test --config playwright.config.mjs

      - name: Upload mobile verification screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haibu-mobile-product-verification
          path: test-results/
          retention-days: 7

      - name: Build SEO source
        run: npm run build:v2-seo

      - name: Build release candidate
        run: npm run build:v2-release

      - name: Audit materialized production consistency
        run: npm run audit:v2-materialized

      - name: Audit catalog identity consistency
        run: npm run audit:catalog-consistency

      - name: Audit full product catalog consistency
        run: npm run audit:product-catalog

      - name: Audit production SEO
        run: npm run audit:v2-seo

      - name: Audit HTTP 404 behavior
        run: npm run audit:v2-404
