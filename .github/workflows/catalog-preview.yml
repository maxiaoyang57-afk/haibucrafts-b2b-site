name: Catalog Preview Acceptance

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Product batch PR number
        required: true
        type: number

permissions: {}

concurrency:
  group: catalog-preview-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'products/monica-batch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: catalog-preview
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.resolve.outputs.head }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      # This is the trusted base commit. Never check out or run code from the product PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Resolve the exact product PR and deployed Preview
        id: resolve
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/verify-catalog-preview.mjs resolve
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/catalog-preview-engine" --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/catalog-preview-engine/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise live galleries, search and quote prefill
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/verify-catalog-preview.mjs browser

  report:
    needs: preview
    if: ${{ always() && !cancelled() && needs.preview.outputs.head != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.preview.outputs.head }}
      RESULT: ${{ needs.preview.result }}
    steps:
      - name: Report result on the tested PR head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          if [[ "$RESULT" == success ]]; then
            state=success
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --raw-field "state=$state" \
            --raw-field 'context=catalog-preview/375-1440' \
            --raw-field "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --raw-field 'description=Live Vercel Preview catalog, gallery and quote checks' >/dev/null
