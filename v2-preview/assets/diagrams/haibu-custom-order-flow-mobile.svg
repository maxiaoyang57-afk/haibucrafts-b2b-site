<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1065" viewBox="0 0 360 1065" role="img" aria-labelledby="title desc"><title id="title">HAIBU custom order flow: mobile sequence</title><desc id="desc">Buyer brief, specifications and development terms, separate resin or polymer clay preparation, physical sample and written approval, separate bulk terms and batch checks, then packing and delivery. Revise samples as needed before approval.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#697586" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.small{fill:#586474;font-size:15px}.label{font-weight:700;font-size:19px}.route{font-weight:700;font-size:18px}.num{font-size:13px;fill:#5b4ca6;font-weight:700}.line{fill:none;stroke:#697586;stroke-width:1.5;marker-end:url(#arrow)}.icon{fill:none;stroke:#172033;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style><rect width="360" height="1065" fill="#fff"/><path class="line" d="M180 120V150"/><path class="line" d="M180 260V283H89V308"/><path class="line" d="M180 260V283H271V308"/><path class="line" d="M89 448V477H180V510"/><path class="line" d="M271 448V477H180V510"/><path class="line" d="M180 635V760"/><path class="line" d="M180 870V905"/><g transform="translate(24 10)"><rect width="312" height="110" rx="3" fill="#fff" stroke="#bcc4cf"/><text class="num" x="14" y="21">01</text><g class="icon" transform="translate(272 11) scale(.7)"><rect x="5" y="4" width="18" height="23" rx="2"/><path d="M10 4V1h8v3M9 11h10M9 16h10M9 21h6"/></g><text class="label" style="font-size:17px" x="14" y="49">Buyer brief</text><text class="small" style="font-size:14px" x="14" y="74">Use, market, quantity, design and packing</text></g><g transform="translate(24 150)"><rect width="312" height="110" rx="3" fill="#fff" stroke="#bcc4cf"/><text class="num" x="14" y="21">02</text><g class="icon" transform="translate(272 11) scale(.7)"><path d="M2 18L18 2l10 10L12 28zM8 12l4 4M13 7l4 4M18 2l4 4"/></g><text class="label" style="font-size:17px" x="14" y="49">Confirm specs &amp; route</text><text class="small" style="font-size:14px" x="14" y="74">Material, cost and development terms</text></g><g transform="translate(8 308)"><rect width="162" height="140" rx="3" fill="#f6f5fa" stroke="#b9b2d2"/><path d="M0 0h162" stroke="#6d5bd0" stroke-width="3"/><text class="route" style="font-size:16px" x="14" y="28">Resin</text><text class="small" style="font-size:13.5px" x="14" y="52">Shape, back, finish</text><text class="small" style="font-size:13.5px" x="14" y="72">Drawing / model</text><text class="small" style="font-size:13.5px" x="14" y="92">and tooling only</text><text class="small" style="font-size:13.5px" x="14" y="112">when needed</text></g><g transform="translate(190 308)"><rect width="162" height="140" rx="3" fill="#f6f5fa" stroke="#b9b2d2"/><path d="M0 0h162" stroke="#6d5bd0" stroke-width="3"/><text class="route" style="font-size:16px" x="14" y="28">Polymer clay</text><text class="small" style="font-size:13.5px" x="14" y="52">Pattern, form, mix</text><text class="small" style="font-size:13.5px" x="14" y="72">Preparation agreed</text><text class="small" style="font-size:13.5px" x="14" y="92">for the design</text></g><g transform="translate(24 510)"><rect width="312" height="125" rx="3" fill="#fff" stroke="#bcc4cf"/><text class="num" x="14" y="21">03</text><g class="icon" transform="translate(272 11) scale(.7)"><circle cx="15" cy="15" r="12"/><path d="M8 15l5 5 10-11"/></g><text class="label" style="font-size:17px" x="14" y="49">Physical sample &amp; approval</text><text class="small" style="font-size:14px" x="14" y="74">Evaluate in the intended application</text><text class="small" style="font-size:14px" x="14" y="94">Approve the final version in writing</text></g><path class="line" stroke-dasharray="4 4" d="M302 635V669H254V635"/><rect x="60" y="694" width="240" height="28" fill="#fff"/><text class="small" style="font-size:14px" x="62" y="713">Revise and resample as needed</text><g transform="translate(24 760)"><rect width="312" height="110" rx="3" fill="#fff" stroke="#bcc4cf"/><text class="num" x="14" y="21">04</text><g class="icon" transform="translate(272 11) scale(.7)"><circle cx="12" cy="12" r="9"/><path d="M18 18l10 10M8 12l3 3 5-6"/></g><text class="label" style="font-size:17px" x="14" y="49">Bulk terms &amp; batch checks</text><text class="small" style="font-size:14px" x="14" y="74">Separate order terms; agreed inspection</text></g><g transform="translate(24 905)"><rect width="312" height="110" rx="3" fill="#fff" stroke="#bcc4cf"/><text class="num" x="14" y="21">05</text><g class="icon" transform="translate(272 11) scale(.7)"><path d="M3 9l12-6 12 6v15l-12 6-12-6zM3 9l12 6 12-6M15 15v15M9 6l12 6v6"/></g><text class="label" style="font-size:17px" x="14" y="49">Packing &amp; delivery</text><text class="small" style="font-size:14px" x="14" y="74">Labels, cartons and a record for reorders</text></g></svg>