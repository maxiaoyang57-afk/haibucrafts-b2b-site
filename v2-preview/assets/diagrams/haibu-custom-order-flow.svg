<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" role="img" aria-labelledby="title desc"><title id="title">HAIBU custom order flow: from brief to shipment</title><desc id="desc">Buyer brief, specifications and development terms, separate resin or polymer clay preparation, physical sample and written approval, separate bulk terms and batch checks, then packing and delivery. Revise samples as needed before approval.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#697586" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.small{fill:#586474;font-size:15px}.label{font-weight:700;font-size:19px}.route{font-weight:700;font-size:18px}.num{font-size:13px;fill:#5b4ca6;font-weight:700}.line{fill:none;stroke:#697586;stroke-width:1.5;marker-end:url(#arrow)}.icon{fill:none;stroke:#172033;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1240" height="440" fill="#fff"/><path class="line" d="M175 228H210"/><path class="line" d="M385 228H409V107H435"/><path class="line" d="M385 228H409V357H435"/><path class="line" d="M630 107H654V228H675"/><path class="line" d="M630 357H654V228H675"/><path class="line" d="M845 228H880"/><path class="line" d="M1035 228H1070"/><g transform="translate(10 170)"><rect width="165" height="116" rx="3" fill="#fff" stroke="#bcc4cf"/><text class="num" x="14" y="21">01</text><g class="icon" transform="translate(125 11) scale(.7)"><rect x="5" y="4" width="18" height="23" rx="2"/><path d="M10 4V1h8v3M9 11h10M9 16h10M9 21h6"/></g><text class="label" style="font-size:19px" x="14" y="49">Buyer brief</text><text class="small" style="font-size:15px" x="14" y="74">Use, market, quantity</text><text class="small" style="font-size:15px" x="14" y="94">Design and packing</text></g><g transform="translate(210 170)"><rect width="175" height="116" rx="3" fill="#fff" stroke="#bcc4cf"/><text class="num" x="14" y="21">02</text><g class="icon" transform="translate(135 11) scale(.7)"><path d="M2 18L18 2l10 10L12 28zM8 12l4 4M13 7l4 4M18 2l4 4"/></g><text class="label" style="font-size:19px" x="14" y="49">Specs &amp; route</text><text class="small" style="font-size:15px" x="14" y="74">Material and cost</text><text class="small" style="font-size:15px" x="14" y="94">Development terms</text></g><g transform="translate(435 45)"><rect width="195" height="125" rx="3" fill="#f6f5fa" stroke="#b9b2d2"/><path d="M0 0h195" stroke="#6d5bd0" stroke-width="3"/><text class="route" style="font-size:18px" x="14" y="28">Resin</text><text class="small" style="font-size:15px" x="14" y="52">Shape, back, finish</text><text class="small" style="font-size:15px" x="14" y="72">Drawing / model and</text><text class="small" style="font-size:15px" x="14" y="92">tooling when needed</text></g><g transform="translate(435 295)"><rect width="195" height="125" rx="3" fill="#f6f5fa" stroke="#b9b2d2"/><path d="M0 0h195" stroke="#6d5bd0" stroke-width="3"/><text class="route" style="font-size:18px" x="14" y="28">Polymer clay</text><text class="small" style="font-size:15px" x="14" y="52">Pattern, form, mix</text><text class="small" style="font-size:15px" x="14" y="72">Preparation agreed</text><text class="small" style="font-size:15px" x="14" y="92">for the design</text></g><g transform="translate(675 170)"><rect width="170" height="116" rx="3" fill="#fff" stroke="#bcc4cf"/><text class="num" x="14" y="21">03</text><g class="icon" transform="translate(130 11) scale(.7)"><circle cx="15" cy="15" r="12"/><path d="M8 15l5 5 10-11"/></g><text class="label" style="font-size:19px" x="14" y="49">Physical sample</text><text class="small" style="font-size:15px" x="14" y="74">Evaluate and revise</text><text class="small" style="font-size:15px" x="14" y="94">Written approval</text></g><g transform="translate(880 170)"><rect width="155" height="116" rx="3" fill="#fff" stroke="#bcc4cf"/><text class="num" x="14" y="21">04</text><g class="icon" transform="translate(115 11) scale(.7)"><circle cx="12" cy="12" r="9"/><path d="M18 18l10 10M8 12l3 3 5-6"/></g><text class="label" style="font-size:19px" x="14" y="49">Batch checks</text><text class="small" style="font-size:15px" x="14" y="74">Bulk order terms</text><text class="small" style="font-size:15px" x="14" y="94">Agreed inspection</text></g><g transform="translate(1070 170)"><rect width="160" height="116" rx="3" fill="#fff" stroke="#bcc4cf"/><text class="num" x="14" y="21">05</text><g class="icon" transform="translate(120 11) scale(.7)"><path d="M3 9l12-6 12 6v15l-12 6-12-6zM3 9l12 6 12-6M15 15v15M9 6l12 6v6"/></g><text class="label" style="font-size:19px" x="14" y="49">Pack &amp; ship</text><text class="small" style="font-size:15px" x="14" y="74">Labels and cartons</text><text class="small" style="font-size:15px" x="14" y="94">Delivery records</text></g><path class="line" stroke-dasharray="4 4" d="M797 286V320H723V286"/><text class="small" style="font-size:15px" x="686" y="355">Revise and resample</text></svg>