<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a Quote | HAIBUCRAFT V2 Preview</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../assets/site-v2.css"><link rel="stylesheet" href="../assets/site-v2-fixes.css"></head><body data-page="quote"><div data-site-header></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="/v2-preview/">Home</a> / Request Quote</div><span class="eyebrow">B2B Inquiry</span><h1>Tell us what you need for a more accurate quotation.</h1><p>This preview form validates product, category and source prefill. It does not submit to the production inquiry endpoint.</p></div></section><section class="section"><div class="container"><div class="scope-note" id="quoteContext" hidden><strong>Selected product:</strong> <span id="selectedProduct"></span></div><form class="quote-form" onsubmit="event.preventDefault();document.getElementById('formStatus').textContent='Preview only — no inquiry was sent.'"><label>Company Name<input name="company" autocomplete="organization" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Product Category<select name="category" id="categoryField"><option value="">Select a category</option><option value="slime-charms">Slime Charms</option><option value="polymer-clay-slices">Polymer Clay Slices</option><option value="resin-charms">Resin Charms</option><option value="sequins-glitter-confetti">Sequins &amp; Glitter Confetti</option></select></label><label>Target Quantity<input name="quantity" inputmode="numeric" placeholder="Example: 5,000 pieces or 200 packs"></label><label>Product Code<input name="product_code" id="productField" readonly placeholder="Filled from product card"></label><label>Product Name<input name="product_name" id="productNameField" readonly placeholder="Filled from product card"></label><label class="full">Project Requirements<textarea name="message" placeholder="Please include selected codes, quantities, packaging, destination market and customization requirements."></textarea></label><input type="hidden" name="source" id="sourceField"><input type="hidden" name="landing_page" id="landingField"><input type="hidden" name="article" id="articleField"><input type="hidden" name="product_image" id="imageField"><input type="hidden" name="referrer" id="referrerField"><div class="full"><button class="btn btn-primary" type="submit">Preview Inquiry</button><p id="formStatus" aria-live="polite"></p></div></form></div></section></main><div data-site-footer></div><script src="../assets/components.js"></script><script src="../assets/site-v2.js"></script><script>(()=>{const p=new URLSearchParams(location.search);const source=p.get('source')||'direct';const landing=p.get('landing_page')||document.referrer||'/v2-preview/';const article=p.get('article')||'';const code=p.get('product_code')||p.get('sku')||'';const product=p.get('product')||'';const image=p.get('image')||'';const category=p.get('category')||'';document.getElementById('sourceField').value=source;document.getElementById('landingField').value=landing;document.getElementById('articleField').value=article;document.getElementById('productField').value=code;document.getElementById('productNameField').value=product;document.getElementById('imageField').value=image;document.getElementById('referrerField').value=document.referrer||'';const categoryField=document.getElementById('categoryField');if(category&&[...categoryField.options].some(o=>o.value===category))categoryField.value=category;if(code||product){document.getElementById('quoteContext').hidden=false;document.getElementById('selectedProduct').textContent=[code,product].filter(Boolean).join(' — ');}})();</script></body></html>
