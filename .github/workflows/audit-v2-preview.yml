name: Audit V2 Preview

on:
  push:
    branches:
      - codex/v2-takeover
      - release/v2-production
    paths:
      - 'v2-preview/**'
      - 'assets/images/products/**'
      - 'scripts/audit-v2-links.mjs'
      - '.github/workflows/audit-v2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit V2 routes, assets, SKUs and quote parameters
        run: node scripts/audit-v2-links.mjs
