name: Build V2 Release Candidate

on:
  push:
    branches:
      - codex/v2-takeover
      - release/v2-production
    paths:
      - 'v2-preview/**'
      - 'api/inquiry.js'
      - 'scripts/build-v2-release-candidate.mjs'
      - 'scripts/audit-v2-runtime.mjs'
      - 'scripts/audit-v2-release-candidate.mjs'
      - 'scripts/generate-v2-acceptance-report.mjs'
      - 'docs/site-v2-production-approval.json'
      - '.github/workflows/build-v2-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run V2 source audit
        run: node scripts/audit-v2-links.mjs

      - name: Run V2 runtime audit
        run: node scripts/audit-v2-runtime.mjs

      - name: Generate production release candidate
        run: node scripts/build-v2-release-candidate.mjs

      - name: Run release candidate audit
        run: node scripts/audit-v2-release-candidate.mjs

      - name: Generate acceptance report
        run: node scripts/generate-v2-acceptance-report.mjs

      - name: Reject preview paths and preview copy
        shell: bash
        run: |
          if grep -RInE '/v2-preview/|Site V2 Preview|Preview branch only|noindex,nofollow' .release-candidate/site-v2 --include='*.html' --include='*.js'; then
            echo 'Release candidate still contains preview-only paths, metadata or copy.'
            exit 1
          fi

      - name: Verify required production files
        shell: bash
        run: |
          test -f .release-candidate/site-v2/index.html
          test -f .release-candidate/site-v2/404.html
          test -f .release-candidate/site-v2/products/index.html
          test -f .release-candidate/site-v2/products/slime-charms-wholesale/index.html
          test -f .release-candidate/site-v2/products/polymer-clay-slices-wholesale/index.html
          test -f .release-candidate/site-v2/products/resin-charms-for-slime/index.html
          test -f .release-candidate/site-v2/products/sequins-glitter-confetti/index.html
          test -f .release-candidate/site-v2/request-quote/index.html
          test -f .release-candidate/site-v2/assets/v2/components.js
          test -f .release-candidate/site-v2/assets/v2/quote-preview.js
          test -f .release-candidate/site-v2/assets/v2/quote-runtime-config.js
          test -f .release-candidate/site-v2/sitemap.xml
          test -f .release-candidate/site-v2/robots.txt
          test -f .release-candidate/site-v2/release-manifest.json
          test -f .release-candidate/site-v2/acceptance-report.md

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo '## HAIBUCRAFT V2 Release Candidate'
            echo ''
            echo '- Source audit: passed'
            echo '- Runtime navigation/API audit: passed'
            echo '- Production-path audit: passed'
            echo '- Quote mode: live'
            echo '- Production approved: true'
            echo '- Production published: false'
            echo '- Artifact: haibucrafts-site-v2-release-candidate'
            echo ''
            cat .release-candidate/site-v2/acceptance-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: haibucrafts-site-v2-release-candidate
          path: .release-candidate/site-v2
          if-no-files-found: error
          retention-days: 14
